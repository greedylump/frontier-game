[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-game"
version = "0.1.0"
description = "A teachable two-player stochastic competition model"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "ipykernel>=6", "pytest>=8"]

[project.scripts]
frontier-game = "frontier_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
